name: Validate containers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Backend tests
        run: python -m pytest -q
        working-directory: backend
      - name: Container entrypoint tests
        run: python -m unittest discover -s deploy/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check frontend dependencies and types
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=low
          npm run typecheck
          npm run build
        working-directory: web
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Analyze and compile Flutter Android client
        run: |
          flutter pub get
          if ! analyze_output="$(flutter analyze 2>&1)"; then
            printf '%s\n' "$analyze_output"
            annotation="$(printf '%s\n' "$analyze_output" | tail -40 | awk '{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}')"
            echo "::error title=Flutter analyze failed::$annotation"
            exit 1
          fi
          printf '%s\n' "$analyze_output"
          if ! build_output="$(flutter build apk --debug 2>&1)"; then
            printf '%s\n' "$build_output"
            annotation="$(printf '%s\n' "$build_output" | tail -60 | awk '{gsub(/%/, "%25"); gsub(/\r/, "%0D"); printf "%s%%0A", $0}')"
            echo "::error title=Flutter Android build failed::$annotation"
            exit 1
          fi
          printf '%s\n' "$build_output"
        working-directory: app

  root-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the repository-root Dockerfile
        shell: bash
        run: |
          set +e
          set -o pipefail
          docker build --progress=plain --file Dockerfile --tag armx:ci . 2>&1 | tee /tmp/armx-docker-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 /tmp/armx-docker-build.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Root Docker image build failed::$message"
            exit "$status"
          fi
      - name: Start the full stack with a non-default runtime port
        run: |
          docker run --detach --name armx-smoke \
            --publish 8080:8080 \
            --env PORT=8080 \
            --env ENV=development \
            --env REQUIRE_TURSO_IN_PRODUCTION=false \
            --env JWT_SECRET="$(openssl rand -hex 32)" \
            --env RENDER_EXTERNAL_URL=https://armx-ci.example \
            --env LLM_PROVIDER=mock \
            armx:ci
      - name: Verify migrations, web, API and signup through the public port
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health > /tmp/armx-health.json \
              && docker exec armx-smoke python /app/deploy/runtime/healthcheck.py; then
              ready=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' armx-smoke)" != "true" ]; then
              docker logs armx-smoke
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "Container did not become healthy within 120 seconds."
            exit 1
          fi
          docker exec armx-smoke grep -q 'listen 8080;' /tmp/armx-nginx.conf
          curl --fail --silent http://localhost:8080/login > /tmp/armx-login.html
          grep -q 'A.R.M.X AI' /tmp/armx-login.html
          curl --fail --silent -X POST http://localhost:8080/api/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"email":"container-smoke@example.com","password":"CI-only-smoke-password-123!","display_name":"Container smoke test"}' \
            > /tmp/armx-signup.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/armx-health.json').read_text())
          assert health['status'] == 'ok' and health['database'] == 'ok', health
          signup = json.loads(Path('/tmp/armx-signup.json').read_text())
          assert signup.get('access_token') and signup.get('refresh_token'), 'Signup did not return tokens'
          print('Root image smoke test passed: migrations, web, API and signup.')
          PY
      - name: Show container logs on failure
        if: failure()
        run: docker logs armx-smoke 2>/dev/null || true
      - name: Stop the smoke-test container
        if: always()
        run: docker rm --force armx-smoke 2>/dev/null || true

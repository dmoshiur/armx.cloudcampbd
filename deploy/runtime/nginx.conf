# Rootless edge proxy. entrypoint.sh substitutes ${PORT} into a copy in /tmp.
worker_processes 1;
pid /tmp/armx-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/armx-nginx-client;
    proxy_temp_path /tmp/armx-nginx-proxy;
    fastcgi_temp_path /tmp/armx-nginx-fastcgi;
    uwsgi_temp_path /tmp/armx-nginx-uwsgi;
    scgi_temp_path /tmp/armx-nginx-scgi;

    # TLS is terminated by the hosting platform. Ignore invalid proto values.
    map $http_x_forwarded_proto $armx_forwarded_proto {
        default $scheme;
        https https;
        http http;
    }
    map $http_upgrade $armx_connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream armx_api {
        server 127.0.0.1:8000;
        keepalive 16;
    }
    upstream armx_web {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen ${PORT};
        server_name _;
        client_max_body_size 10m;

        # Preserve FastAPI's own security headers and preview sandbox policy.
        # Application-level auth and tool rate limits remain authoritative.
        location /api/ {
            proxy_pass http://armx_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $armx_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://armx_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $armx_connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $armx_forwarded_proto;
            proxy_read_timeout 300s;
        }
    }
}

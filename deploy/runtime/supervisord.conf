# All processes run as the image's non-root user. Only nginx's public PORT is
# exposed; the API and Next.js stay on container-local loopback interfaces.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/armx-supervisord.pid

[program:api]
directory=/app/backend
command=/opt/venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --proxy-headers --forwarded-allow-ips 127.0.0.1
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:web]
directory=/app/web
command=/usr/local/bin/node server.js
environment=NODE_ENV="production",HOSTNAME="127.0.0.1",PORT="3000",BACKEND_URL="http://127.0.0.1:8000",NEXT_TELEMETRY_DISABLED="1"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:worker]
directory=/app/backend
command=/opt/venv/bin/python -m app.worker
priority=30
autostart=true
autorestart=true
startsecs=2
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=35
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -c /tmp/armx-nginx.conf -g "daemon off;"
priority=40
autostart=true
autorestart=true
startsecs=1
startretries=5
stopsignal=QUIT
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

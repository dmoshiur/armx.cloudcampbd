# Production-shaped multi-container stack: nginx -> web + api -> Turso.
# Housekeeping runs inside the API lifespan; Redis is not required.
#
#   cp .env.example .env      # fill the root Render/Turso template
#   docker compose -f deploy/docker-compose.yml up -d --build
#
name: armx

x-backend-env: &backend-env
  ENV: ${ENV:-production}
  DEBUG: "false"
  AUTO_CREATE_TABLES: "false"
  REQUIRE_TURSO_IN_PRODUCTION: "true"
  TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?set TURSO_DATABASE_URL}
  TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:?set TURSO_AUTH_TOKEN}
  TURSO_REPLICA_PATH: /data/turso-replica.db
  TURSO_SYNC_INTERVAL_SECONDS: ${TURSO_SYNC_INTERVAL_SECONDS:-30}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random value}
  WEB_ORIGIN: ${WEB_ORIGIN:-https://armx.example}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://armx.example}
  FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-}
  FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
  FIRST_ADMIN_DISPLAY_NAME: ${FIRST_ADMIN_DISPLAY_NAME:-Platform owner}
  INITIAL_SETUP_TOKEN: ${INITIAL_SETUP_TOKEN:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  LLM_ROUTING_STRATEGY: ${LLM_ROUTING_STRATEGY:-balanced}
  LLM_SECRETS_KEY: ${LLM_SECRETS_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
  ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@armx.example}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
  HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
  HOME_ASSISTANT_ALLOWED_ENTITIES: ${HOME_ASSISTANT_ALLOWED_ENTITIES:-light.living_room,light.desk,switch.fan}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-none}
  GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
  GOOGLE_SEARCH_CX: ${GOOGLE_SEARCH_CX:-}
  PIPELINE_MODE: ${PIPELINE_MODE:-simulated}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_DEFAULT_ORG: ${GITHUB_DEFAULT_ORG:-}
  GITHUB_ALLOWED_TARGETS: ${GITHUB_ALLOWED_TARGETS:-}
  VERCEL_TOKEN: ${VERCEL_TOKEN:-}
  VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
  TURSO_API_TOKEN: ${TURSO_API_TOKEN:-}
  TURSO_ORG: ${TURSO_ORG:-}
  MESSAGING_MODE: ${MESSAGING_MODE:-simulated}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
  MESSENGER_TOKEN: ${MESSENGER_TOKEN:-}
  MESSENGER_PAGE_ID: ${MESSENGER_PAGE_ID:-}
  PROJECT_WORKSPACE: /data/workspace

services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - appdata:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"

  web:
    build: ../web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api: { condition: service_started }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  appdata:

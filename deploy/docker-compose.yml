# Production-shaped stack: nginx -> (web, api) -> postgres + redis, plus the worker.
#
#   cp .env.example .env      # fill in real values
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec api python -m scripts.create_admin
#
name: armx

x-backend-env: &backend-env
  ENV: ${ENV:-production}
  DEBUG: "false"
  AUTO_CREATE_TABLES: "false"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-armx}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-armx}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random value}
  WEB_ORIGIN: ${WEB_ORIGIN:-https://armx.example}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://armx.example}
  LLM_PROVIDER: ${LLM_PROVIDER:-claude}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_API_KEYS: ${ANTHROPIC_API_KEYS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-no-reply@armx.example}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
  HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
  HOME_ASSISTANT_ALLOWED_ENTITIES: ${HOME_ASSISTANT_ALLOWED_ENTITIES:-light.living_room,light.desk,switch.fan}
  SEARCH_PROVIDER: ${SEARCH_PROVIDER:-none}
  GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY:-}
  GOOGLE_SEARCH_CX: ${GOOGLE_SEARCH_CX:-}
  PIPELINE_MODE: ${PIPELINE_MODE:-simulated}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_DEFAULT_ORG: ${GITHUB_DEFAULT_ORG:-}
  GITHUB_ALLOWED_TARGETS: ${GITHUB_ALLOWED_TARGETS:-}
  VERCEL_TOKEN: ${VERCEL_TOKEN:-}
  VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
  TURSO_API_TOKEN: ${TURSO_API_TOKEN:-}
  TURSO_ORG: ${TURSO_ORG:-}
  MESSAGING_MODE: ${MESSAGING_MODE:-simulated}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
  MESSENGER_TOKEN: ${MESSENGER_TOKEN:-}
  MESSENGER_PAGE_ID: ${MESSENGER_PAGE_ID:-}
  PROJECT_WORKSPACE: /data/workspace

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-armx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-armx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-armx} -d ${POSTGRES_DB:-armx}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-changeme}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - appdata:/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"

  worker:
    build: ../backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    depends_on:
      api: { condition: service_started }
    volumes:
      - appdata:/data
    command: ["python", "-m", "app.worker"]

  web:
    build: ../web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      api: { condition: service_started }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  appdata:

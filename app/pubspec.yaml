name: armx_app
description: A.R.M.X AI native client (Android, desktop, Wear OS companion).
publish_to: "none"
version: 3.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0
  # Floating overlay bubble (Android). iOS has no equivalent - the app says so.
  flutter_overlay_window: ^0.4.5

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
